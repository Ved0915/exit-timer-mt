<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/flatpickr.min.css">
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 50.9 50.9" width="28" height="28" aria-label="ManekTech">
          <rect width="50.9" height="50.9" fill="#DA1F27"/>
          <g fill="#fff">
            <path d="M21.3,17.5c1.3-1.3,3.2-1.9,4.7-1.9c3.6,0,6.3,1.8,6.3,5.6v11.5h-2.6V21c0-2.4-1.8-3.1-3.7-3.1c-1.5,0-3.4,0.9-3.4,2.4v12.3h-2.5V20.6c0-1.8-1.9-2.6-3.9-2.6c-1.2,0-2.3,0.3-3,0.8v14h-2.6V17.1c1.6-0.9,3.7-1.5,5.7-1.5C18.1,15.6,20,16.2,21.3,17.5z"/>
            <path d="M40.6,30.7c-1.6-0.4-2.5-1.7-2.5-3.2v-6.7h3.4v-2.4h-3.4v-4L35.5,17v10.5c0,3.5,2.5,5.5,5.9,5.5c0.4,0,0.6,0,1-0.1v-2.2c-0.3,0.1-0.6,0.1-0.9,0.1C41.1,30.8,40.8,30.8,40.6,30.7z"/>
            <polygon points="38.1,12.6 35.5,12.6 35.5,10.1"/>
            <rect x="10.5" y="36.1" width="31.9" height="2.6"/>
          </g>
        </svg>
      </div>
      <span class="header-title">Exit Timer</span>
      <span class="badge" id="badge" style="display:none;"></span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" title="Toggle theme"><!-- filled by JS --></button>
      <button class="icon-btn" id="fmtBtn" title="Toggle 12/24-hour" style="font-size:11px;font-weight:700;">24h</button>

      <button class="icon-btn" id="menuBtn" title="Menu" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
        </svg>
      </button>

      <div class="menu-pop" id="menuPop" role="menu">
        <button class="menu-item" id="refreshBtn" role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span>Refresh</span>
        </button>
        <button class="menu-item" id="sessionsBtn" role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <span id="sessionsLabel">Show sessions</span>
        </button>
        <button class="menu-item" id="manualBtn" role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/><line x1="17" y1="4" x2="21" y2="4"/><line x1="19" y1="2" x2="19" y2="6"/>
          </svg>
          <span>Add manual time</span>
        </button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="exportBtn" role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Export month (Excel)</span>
        </button>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <span>Fetching attendance data…</span>
    </div>
  </div>

  <div class="footer" id="mainFooter" style="display:none;">
    <div class="foot-left">
      <div class="foot-dot" id="footDot" title=""></div>
      <span class="foot-date" id="footDate"></span>
    </div>
    <div class="foot-right">
      <span class="foot-time" id="liveTime"></span>
    </div>
  </div>

  <div class="credit">Designed &amp; developed by <b>Vedprakash Dhaka</b></div>

  <script src="js/flatpickr.min.js"></script>
  <script src="js/exceljs.min.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
